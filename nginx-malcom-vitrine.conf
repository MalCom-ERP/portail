# ==============================================================================
# Nginx Configuration Haute Performance — malcom-lgc.com
# Chemin recommandé sur le VPS : /etc/nginx/sites-available/malcom-lgc.com
# ==============================================================================

# 1. Redirection HTTP vers HTTPS (forcée)
server {
    listen 80;
    listen [::]:80;
    server_name malcom-lgc.com www.malcom-lgc.com;
    return 301 https://malcom-lgc.com$request_uri;
}

# 2. Redirection www vers apex (canonique unique)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.malcom-lgc.com;

    # Certificats SSL (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/malcom-lgc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/malcom-lgc.com/privkey.pem;

    return 301 https://malcom-lgc.com$request_uri;
}

# 3. Serveur Principal HTTPS Ultra-Performant
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name malcom-lgc.com;

    root /var/www/malcom/vitrine;
    index index.html;

    # SSL Optimisé
    ssl_certificate /etc/letsencrypt/live/malcom-lgc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/malcom-lgc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # En-têtes de Sécurité & SEO
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Compression Gzip Haute Performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Cache ultra-rapide pour assets statiques (1 an, immuable)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Sitemap et Robots (mise en cache courte pour Googlebot)
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location = /site.webmanifest {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Page principale (index.html)
    location / {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
