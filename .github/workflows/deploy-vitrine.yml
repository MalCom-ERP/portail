name: Deploy Vitrine (malcom-lgc.com)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout Vitrine
        uses: actions/checkout@v4

      - name: Deploy Vitrine locally on VPS via Rsync
        run: |
          mkdir -p /var/www/malcom/vitrine
          rsync -avz --delete \
            --no-owner --no-group \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.agent' \
            --exclude='.gemini' \
            --exclude='.impeccable' \
            --exclude='.wrangler' \
            --exclude='.DS_Store' \
            --exclude='downloads/' \
            ./ /var/www/malcom/vitrine/
